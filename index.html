<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c54b32">
  <meta name="description" content="En glad och enkel inköpslista som sparas i din webbläsare.">
  <title>Handla glatt – min inköpslista</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <span class="brand">LITE PLANERING, MER MATGLÄDJE</span>
      <div class="heading"><h1>Handla glatt<span>.</span></h1><span class="basket" aria-hidden="true">🧺</span></div>
      <p>Från första tanken till sista varan i korgen.</p>
    </header>
    <section class="card" aria-label="Min inköpslista">
      <form id="add-form">
        <label for="item-name">Vad behöver du handla?</label>
        <div class="input-row"><input id="item-name" name="item" placeholder="Till exempel tomater" maxlength="200" autocomplete="off" required><button class="add" type="submit">Lägg till <span aria-hidden="true">+</span></button></div>
      </form>
      <div class="list-heading"><h2>Min inköpslista</h2><span id="count">0 kvar</span></div>
      <div id="empty"><span aria-hidden="true">🍋</span><h3>Här börjar något gott!</h3><p>Lägg till din första vara ovan.</p></div>
      <ul id="items" aria-label="Varor"></ul>
      <footer class="list-footer"><span id="completed-count">0 avbockade</span><button id="clear" type="button" disabled>Rensa avbockade</button></footer>
    </section>
    <p id="storage-note" class="note">Sparas automatiskt i den här webbläsaren. <span aria-hidden="true">♡</span></p>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
